name: Live refresh

# Keep the site near-real-time during play.
#
# GitHub's scheduled `cron` trigger is best-effort and, under load, only
# actually fires every 1.5-3h — far too slow to track a live round. So the
# cron is NOT the cadence here; it only (re)starts the loop below. Once a run
# is going, it drives its own tight cadence: every ~5 minutes it runs a cheap
# change-check (stdlib only, no sim) and re-simulates only when a live event's
# scores actually moved. It keeps looping until no points event is live or it
# nears the 6h per-job ceiling, then yields.
#
# Continuation across that ceiling needs no PAT: the shared concurrency group
# keeps exactly one run active and one queued, and the coarse cron reliably
# leaves a queued successor during any 5.5h window, so it starts the instant
# the active run yields. Between rounds / overnight the loop idles on the cheap
# check (no pip, no sim) and, when nothing is live, exits in seconds. Public
# repo => Actions minutes are free, so holding a runner during an event is fine.
on:
  schedule:
    - cron: "*/15 * * * *"   # only needs to (re)start / keep a successor queued
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-forecast   # share with the weekly full refresh; never overlap
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under GitHub's 6h ceiling; loop yields first
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore results cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: pdga-cache-2026-${{ github.run_id }}
          restore-keys: pdga-cache-2026-

      # Failure posture (added after a season of silent failure modes): any
      # step that throws counts a consecutive failure; three in a row fail the
      # RUN so the owner is notified, and the cron restarts the loop within
      # 15 minutes — a persistent crash during play is loud, not a quietly
      # stale site. A failed refresh also restores the committed livecheck
      # signature, because livecheck advances it at gate time: without the
      # restore, a crash after the last score change of the night would read
      # "unchanged" forever and never retry. Invariant violations (see
      # dgpt/invariants.py) fail the run AFTER the site has been published and
      # any state committed, and only when the violation set is new
      # (data/cache/invariant_alerted.txt de-duplicates), so a persistent
      # mismatch doesn't spam a red run every six minutes.
      - name: Drive the live refresh loop
        env:
          PDGA_USERNAME: ${{ secrets.PDGA_USERNAME }}
          PDGA_PASSWORD: ${{ secrets.PDGA_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BUDGET=$(( $(date +%s) + 330 * 60 ))   # ~5.5h, then yield to the successor
          deps_ready=0
          failures=0
          did_refresh=0     # set once this run re-simulates; gates the validate below
          exit_reason=

          # 0 = live, 3 = clean "nothing live", 1 = crashed (traceback shows)
          is_live() {
            python -c 'import sys; from dgpt import schedule; sys.exit(0 if schedule.live_events() else 3)'
          }

          fail_step() {
            failures=$((failures + 1))
            echo "::warning::$1 (consecutive failures: $failures)"
            if [ "$failures" -ge 3 ]; then
              echo "::error::Three consecutive live-refresh failures — failing the run so it gets seen. The cron restarts the loop."
              exit 1
            fi
          }

          while :; do
            # GitHub's default run shell is `bash -e`: a bare `is_live` that
            # returns 3 (nothing live) would kill the script instantly with
            # no output (observed 2026-07-27, first quiet night after this
            # loop shipped). Capture the code in a condition context, which
            # errexit exempts.
            live_rc=0; is_live || live_rc=$?
            if [ "$live_rc" = 3 ]; then
              echo "No points event live — exiting (cron will restart when one is)."
              exit_reason=idle
              break
            elif [ "$live_rc" != 0 ]; then
              fail_step "is_live check crashed"
              sleep 300; continue
            fi

            # cheap gate (stdlib only): does anything actually need re-simulating?
            if out=$(env -u GITHUB_OUTPUT python -m dgpt.livecheck 2>&1); then
              status=$(printf '%s\n' "$out" | tail -n1)
            else
              printf '%s\n' "$out" | tail -n5
              fail_step "livecheck crashed"
              sleep 300; continue
            fi
            echo "change-check: $status"

            if [ "$status" != "changed" ]; then
              failures=0   # a clean idle iteration = the pipeline is healthy
            fi
            if [ "$status" = "changed" ]; then
              if [ "$deps_ready" = "0" ]; then
                if pip install -r requirements.txt; then
                  deps_ready=1
                else
                  fail_step "pip install failed"
                  sleep 300; continue
                fi
              fi
              if python -m dgpt.refresh --sims 100000; then
                failures=0
                did_refresh=1
              else
                # livecheck already advanced the signature; restore it so the
                # next iteration re-detects the change and retries the refresh
                git checkout -- data/live_signature.txt || true
                fail_step "refresh crashed"
                sleep 300; continue
              fi
              # Publish the regenerated bundle to `site` (a single parentless
              # commit, force-pushed) BEFORE committing state. On failure the
              # signature has not been committed yet, so restoring it makes the
              # next iteration re-detect the change and retry the publish —
              # the same recovery the refresh-crash path above uses.
              if ! .github/publish-site.sh; then
                git checkout -- data/live_signature.txt || true
                fail_step "site publish failed"
                sleep 300; continue
              fi
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true

              # Cross-run state only: the bundle no longer lands on main, so
              # most live iterations now make no commit here at all.
              git add data predictions
              if git diff --cached --quiet; then
                echo "no state change after refresh"
              else
                git commit -m "Refresh pipeline state ($(date -u +'%F %H:%MZ'))"
                # a concurrent merge/weekly refresh could have moved main
                git push || { git pull --rebase --autostash && git push; }
              fi
              # publish-gate invariants: alert on NEW violations, after the push
              viol=data/cache/invariant_violations.txt
              if [ -s "$viol" ] && ! cmp -s "$viol" data/cache/invariant_alerted.txt; then
                cp "$viol" data/cache/invariant_alerted.txt
                echo "::error::Live data failed invariant checks (data still published — see dgpt/invariants.py):"
                cat "$viol"
                exit 1
              fi
            fi

            if [ "$(date +%s)" -ge "$BUDGET" ]; then
              echo "Near job time limit — yielding; the queued successor takes over."
              exit_reason=yield
              break
            fi
            sleep 300
          done

          # Cross-check the standings against StatMando once a tournament has
          # actually wrapped in this run: the loop refreshed at least once and
          # then went idle because nothing is live any more.
          #
          # This lives here because the weekly refresh.yml — which has run
          # dgpt.validate all along — shares the `refresh-forecast` concurrency
          # group with this workflow, so during a tournament its queued run is
          # cancelled by the next one and it never executes. It was cancelled
          # on 2026-08-07, -08 and -09; the last time it validated anything was
          # 2026-08-06. A cross-check that only runs when no event is on is the
          # one that never sees the weekend that broke something.
          #
          # Gated on did_refresh so the 15-minute cron restarts don't re-run it
          # every quarter hour all week, and skipped on a budget yield because
          # the event is still live then and StatMando lags play. Roughly one
          # run per tournament, right after it banks — which is exactly when a
          # banking bug shows up as a points diff. stdlib only, no pip needed.
          if [ "${exit_reason:-}" = "idle" ] && [ "$did_refresh" = "1" ]; then
            echo "Tournament finished this run — validating standings against StatMando."
            if python -m dgpt.validate; then
              echo "validate: standings match"
            else
              echo "::error::Standings disagree with StatMando after an event banked (data still published — see dgpt/validate.py)"
              exit 1
            fi
          fi
