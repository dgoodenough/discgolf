name: Probe Ledgestone finals round (one-shot)
on:
  push:
    branches: [claude/ledgestone-round-count]
    paths: ['.github/workflows/probe-ledge2.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Is round 12 a full round or a Final 9?
        run: |
          python - <<'EOF'
          import json
          from dgpt import live_api
          ev = live_api.fetch_event(96414)
          print("RoundsList:", json.dumps(ev.get("RoundsList"), default=str)[:900])
          for rnd in (1, 2, 3, 12):
              try:
                  data = live_api.fetch_round(96414, "MPO", rnd)
              except Exception as e:
                  print(f"round {rnd}: {type(e).__name__} {e}")
                  continue
              sc = data.get("scores") or []
              meta = {k: v for k, v in data.items() if k != "scores"}
              print(f"\nround {rnd}: rows={len(sc)} holes={meta.get('holes')} "
                    f"pool={meta.get('pool')} layouts={json.dumps(meta.get('layouts'), default=str)[:220]}")
              tt = meta.get("tee_times")
              print(f"   tee_times type={type(tt).__name__} len={len(tt) if hasattr(tt,'__len__') else 'n/a'}")
              if sc:
                  s = sc[0]
                  print("   sample:", json.dumps({k: s.get(k) for k in
                        ("Name","PDGANum","RoundtoPar","Played","HasRoundScore","RunningPlace")}))
          # how many FPO rows in the finals, for contrast
          for div in ("FPO",):
              try:
                  n = len((live_api.fetch_round(96414, div, 12).get("scores") or []))
                  print(f"\n{div} round 12 rows: {n}")
              except Exception as e:
                  print(f"\n{div} round 12: {type(e).__name__}")
          EOF
