name: Publish docs (no re-simulation)

# Push the static pages live without re-running the forecast.
#
# Since notes/HARDENING.md item 6 the site is published from the `site` branch
# by the refresh workflows, which means an edit to index.html, how-it-works.html
# or the stylesheets does NOT go live when it merges — it waits for the next
# refresh (the 11:00 UTC cron, or a live-refresh iteration during play). That
# is fine for a copy tweak and wrong for a fix someone is waiting on, so this
# publishes `docs/` on demand in well under a minute: no pip, no 100k sims.
#
# It does NOT touch the data. main stops tracking docs/data, so a fresh
# checkout has the pages and no bundle; this carries the currently-published
# bundle across unchanged, and publish-site.sh refuses to run at all if that
# step failed to produce one. Use "Refresh forecast" when you want new numbers.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

# Own group since 2026-09-17. This sat in `refresh-forecast-v2` to avoid
# racing the live loop's publish, but a group holds only one PENDING run, so
# dispatching this during play evicted the live loop's queued successor — the
# mechanism that stalled live scoring for 68 minutes that day (the daily
# refresh did it on a cron; a human dispatching this would do the same thing
# on purpose). Run #3 on 2026-09-05 shows the other side of it: queued 90
# minutes behind the live loop, then cancelled by the next arrival.
#
# The race this used to prevent is real but cheap: both force-push `site` to a
# single parentless commit, so the loser is simply superseded, and the live
# loop republishes within ~5 minutes anyway. A warning is enough.
concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Warn if a points event is live
        run: |
          rc=0
          # python3, not python: this job has no setup-python step. A missing
          # interpreter gives rc=127, which simply skips the warning.
          python3 -c 'import sys; from dgpt import schedule; sys.exit(0 if schedule.live_events() else 3)' || rc=$?
          if [ "$rc" = 0 ]; then
            echo "::warning::A points event is live. This publish and the live loop's next one (within ~5 min) both force-push \`site\`; whichever lands second wins. Re-dispatch if your pages do not appear."
          fi

      - name: Carry the published data bundle across
        run: |
          set -euo pipefail
          git fetch --depth=1 origin site
          git restore --source=FETCH_HEAD --worktree -- docs/data
          echo "carried over:"
          ls -l docs/data

      - name: Publish the site
        run: .github/publish-site.sh

      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
            for i in $(seq 1 20); do
              sleep 10
              status=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status)
              echo "attempt $attempt: $status"
              [ "$status" = "built" ] && exit 0
              [ "$status" = "errored" ] && break
            done
          done
          echo "::warning::Pages did not reach 'built' after 3 attempts (the site branch was still updated)"
