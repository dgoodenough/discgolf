name: Publish docs (no re-simulation)

# Push the static pages live without re-running the forecast.
#
# Since HARDENING item 6 the site is published from the `site` branch by the
# refresh workflows, which means an edit to index.html, how-it-works.html or
# the stylesheets does NOT go live when it merges — it waits for the next
# refresh (the 11:00 UTC cron, or a live-refresh iteration during play). That
# is fine for a copy tweak and wrong for a fix someone is waiting on, so this
# publishes `docs/` on demand in well under a minute: no pip, no 100k sims.
#
# It does NOT touch the data. main stops tracking docs/data, so a fresh
# checkout has the pages and no bundle; this carries the currently-published
# bundle across unchanged, and publish-site.sh refuses to run at all if that
# step failed to produce one. Use "Refresh forecast" when you want new numbers.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-forecast   # never race the live loop's own publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Carry the published data bundle across
        run: |
          set -euo pipefail
          git fetch --depth=1 origin site
          git restore --source=FETCH_HEAD --worktree -- docs/data
          echo "carried over:"
          ls -l docs/data

      - name: Publish the site
        run: .github/publish-site.sh

      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
            for i in $(seq 1 20); do
              sleep 10
              status=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status)
              echo "attempt $attempt: $status"
              [ "$status" = "built" ] && exit 0
              [ "$status" = "errored" ] && break
            done
          done
          echo "::warning::Pages did not reach 'built' after 3 attempts (the site branch was still updated)"
