name: Probe Jomez finals rounds (one-shot)

# Model shows Orum winning 100195 and Buhr 2nd; Buhr actually won. Suspect a
# finals round (DGPT finals use round ids 11/12) we aren't reading. Read-only.
on:
  push:
    branches: [claude/standings-attendance-bug-8j9c7k]
    paths: ['.github/workflows/probe-jomez.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dump event + all round sheets
        run: |
          python - <<'EOF'
          import json
          from dgpt import live_api

          ev = live_api.fetch_event(100195)
          print("Name:", ev.get("Name"))
          print("FinalRound:", ev.get("FinalRound"), "| HighestCompletedRound:", ev.get("HighestCompletedRound"),
                "| LatestRound:", ev.get("LatestRound"))
          print("Finals flag:", ev.get("Finals"), "| Semis:", ev.get("Semis"))
          print("RoundsList:", json.dumps(ev.get("RoundsList"), default=str)[:600])
          print("Rounds:", json.dumps(ev.get("Rounds"), default=str)[:600])
          mpo = next((x for x in ev["Divisions"] if x["Division"] == "MPO"), None)
          print("MPO division:", json.dumps(mpo, default=str))

          for rnd in (1, 2, 3, 4, 11, 12):
              try:
                  data = live_api.fetch_round(100195, "MPO", rnd)
              except Exception as e:
                  print(f"\nround {rnd}: {type(e).__name__} {getattr(e,'code','')}")
                  continue
              sc = data.get("scores") or []
              print(f"\nround {rnd}: {len(sc)} rows | meta keys {sorted(k for k in data if k!='scores')[:12]}")
              top = sorted([s for s in sc if s.get("RunningPlace")], key=lambda s: s.get("RunningPlace") or 999)[:4]
              for s in top:
                  print("   ", json.dumps({k: s.get(k) for k in
                        ("Name","RunningPlace","ToPar","RoundtoPar","Played","HasRoundScore","GrandTotal")}))

          print("\nfinal_results(MPO) top 4 as the banker would see it:")
          for r in live_api.final_results(100195, "MPO", use_cache=False)[:4]:
              print("   ", r)
          EOF
