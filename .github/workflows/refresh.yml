name: Refresh forecast

# Keeps the live site current: re-pulls schedule/results/registrations,
# recomputes standings, re-runs the 100k-sim forecast, and commits if
# anything changed (which redeploys GitHub Pages).
#
# Daily. Originally Mondays (weekend results) + Thursdays (registration
# lists), but a registration drop announced mid-week sat stale for up to
# three days — the PDGA field list is the source of record for attendance,
# and it changes on no schedule (McBeth's Discmania withdrawal, 2026-08-03,
# landed on a Monday afternoon). A daily run bounds registration staleness
# at ~24h, gives the movers day window a real snapshot every day, and costs
# ~3 CI minutes (free on a public repo). GitHub's cron is best-effort, so
# treat 11:00 UTC as "sometime that morning".
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even while a points event is live (races the live loop's publish)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

# Its own group as of 2026-09-17. This used to share `refresh-forecast-v2`
# with live-refresh.yml so the two could never overlap, but GitHub allows only
# ONE pending run per group: a run arriving while another holds the group
# evicts whatever was queued behind it. This workflow's 11:00 cron fired late
# at 15:29Z on 2026-09-17, evicted the live loop's queued successor, and then
# inherited the slot when that loop yielded at its 5.5h budget — so the live
# refresh simply stopped, mid-round-1 of the Green Mountain Championship, with
# nothing red to show for it. Overlap is now prevented by the live gate below
# instead, which is the weaker guarantee but cannot strand the live loop.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  # Stand down entirely while a points event is on. The live loop refreshes
  # every ~5 minutes during play and already covers everything this workflow
  # does except `project.run()` — the experimental 2027 / EuroTour tabs, whose
  # inputs move on the scale of weeks and whose last published bundle the live
  # loop carries across on every republish. Racing it for the same two branches
  # to regenerate those is a bad trade; stale-by-a-weekend is the right answer.
  #
  # stdlib only (schedule.live_events reads data/schedule_2026.csv off disk),
  # so this costs a checkout and no pip. Fails closed: a crashed check stops
  # the run rather than being read as "nothing live".
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      live: ${{ steps.check.outputs.live }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          rc=0
          python -c 'import sys; from dgpt import schedule; sys.exit(0 if schedule.live_events() else 3)' || rc=$?
          case "$rc" in
            0) echo "A points event is live — deferring to live-refresh.yml."
               echo "live=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "live=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::live_events() check crashed (rc=$rc)"; exit 1 ;;
          esac

  # `force` is the manual override. The live gate is there to stop the daily
  # CRON walking into a tournament; a person dispatching this has a reason the
  # schedule cannot know — on 2026-09-17 it was publishing the What-if tab's
  # `meta.whatif`, which only a full projection run produces and which the
  # live loop, running --skip-projection, can never generate on its own.
  #
  # Forcing during play is not free, and the cost is not the publish race —
  # it is that the live loop carries the projection bundles across ONCE, at
  # the start of its run, and republishes that snapshot every iteration. A
  # bundle published underneath a running loop is overwritten within ~5
  # minutes. To make a forced run stick, stop the live loop first and restart
  # it after, so it re-carries what this run published.
  refresh:
    needs: gate
    if: needs.gate.outputs.live != 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `ref: main` matters: with no ref, checkout takes the SHA pinned when
      # the run was CREATED, which for a run that sat queued is not main's tip.
      # On 2026-09-17 that was a 95-minute-old SHA and the push below was
      # rejected non-fast-forward, losing the state commit and reddening a run
      # that had otherwise done its job.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore results cache
        uses: actions/cache@v4
        with:
          path: data/cache
          # completed-event results never change; let the cache grow all season
          key: pdga-cache-2026-${{ github.run_id }}
          restore-keys: pdga-cache-2026-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The daily run is the one that regenerates the experimental 2027 /
      # EuroTour projections; the live loop skips them (see live-refresh.yml).
      - name: Refresh standings and projections
        env:
          PDGA_USERNAME: ${{ secrets.PDGA_USERNAME }}
          PDGA_PASSWORD: ${{ secrets.PDGA_PASSWORD }}
        run: python -m dgpt.refresh --sims 100000

      # Publish first, commit state second: the site is the deliverable, and if
      # the publish fails the run goes red without having advanced anything.
      # `site` is force-pushed to a single parentless commit, so republishing
      # an unchanged bundle costs no history and needs no change detection.
      - name: Publish the site
        run: .github/publish-site.sh

      - name: Commit pipeline state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only cross-run state lives on main now — the livecheck signature,
          # the ratings snapshot, the schedule, and the prediction history the
          # backtest reads. The generated bundle goes to the `site` branch, so
          # a refresh that changes nothing durable makes no commit at all.
          git add data predictions
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Refresh pipeline state ($(date -u +%F))"
            # Same fallback the live loop uses: the live refresh can land a
            # commit between this checkout and this push.
            git push || { git pull --rebase --autostash && git push; }
          fi

      # Deploy BEFORE validating: a validate failure must mark the run red
      # (owner gets notified) without blocking the publish. With the deploy
      # after it, a validate failure skipped this step and left the site
      # serving stale data (observed 2026-07-13: StatMando's FPO page was
      # mid-update, validate exited 1, and with no live event to push again
      # the site would have sat stale until Thursday's refresh).
      # Unconditional now: the publish step above always moves `site`, so
      # there is no "nothing changed" case to skip, and a Pages build stuck in
      # "building" past the retry budget (observed 2026-08-06, ~10 min of
      # queueing) is re-kicked by the next run rather than needing a dispatch.
      - name: Trigger Pages build (retry on transient deploy failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # bot pushes (GITHUB_TOKEN) don't auto-trigger legacy Pages, and the
          # deploy step occasionally returns "try again later" and sticks in an
          # errored state — so trigger explicitly and retry until it builds.
          for attempt in 1 2 3; do
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
            for i in $(seq 1 20); do
              sleep 10
              status=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status)
              echo "attempt $attempt: $status"
              [ "$status" = "built" ] && exit 0
              [ "$status" = "errored" ] && break
            done
          done
          echo "::warning::Pages did not reach 'built' after 3 attempts (data commit still landed)"

      # Last steps: a failure here fails the run (owner gets notified) after
      # the data commit and deploy have already gone out. Runs weekly rather
      # than in the live cron because StatMando can lag right after events.
      - name: Validate standings against StatMando
        run: python -m dgpt.validate

      # The refresh wrote data/cache/invariant_violations.txt (empty = clean);
      # see dgpt/invariants.py. Live events rarely overlap this schedule, so
      # this is usually a no-op — but if one does, bad-looking live data marks
      # the run red without having blocked the publish.
      - name: Check live-data invariants
        if: always()
        run: |
          if [ -s data/cache/invariant_violations.txt ]; then
            echo "::error::Live data failed invariant checks (data still published):"
            cat data/cache/invariant_violations.txt
            exit 1
          fi
